<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Zugang nicht eingerichtet</title>
<style>
:root{--bg:#f4f4f4;--panel:#fff;--ink:#333;--muted:#666;--accent:#009ba3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--panel:#1b1e22;--ink:#e8e8e8;--muted:#a3a3a3}}
:root[data-theme="dark"]{--bg:#121417;--panel:#1b1e22;--ink:#e8e8e8;--muted:#a3a3a3}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
div{background:var(--panel);border-top:4px solid var(--accent);padding:24px 28px;max-width:520px}
h1{font-size:18px;margin:0 0 8px}p{color:var(--muted);margin:0}
</style></head>
<body><div><h1>Zugang nicht eingerichtet</h1>
<p>Für diesen Dienst sind noch keine Zugangsdaten hinterlegt. In Render die Umgebungsvariablen BASIC_AUTH_USER und BASIC_AUTH_PASSWORD setzen und den Dienst neu starten.</p></div></body></html>
